<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QR Code Styling</title>
    <script type="text/javascript" src="./lib/qr-code-styling.js"></script>
</head>
<body>
<div id="canvas"></div>
<script type="module">
    import {BarcodeMarkerGenerator, MATRIX_4X4_BCH_1393} from "./lib/barcode-marker-generator.js"

    const canvas = document.getElementById("canvas");

    function generateCode(i) {
        const g = new BarcodeMarkerGenerator(MATRIX_4X4_BCH_1393, i);
        return new QRCodeStyling({
            width: 300,
            height: 300,
            type: "svg",
            image: g.asSVGDataURI(),
            data:`https://akodiat.github.io/arView`,
            shape: "square",
            margin:10,
            qrOptions:{
                typeNumber:"0",
                mode:"Byte",
                errorCorrectionLevel:"H"
            },
            imageOptions:{
                    saveAsBlob:true,
                    hideBackgroundDots:false,
                    imageSize:0.68,
            },
            dotsOptions:{
                type:"square",
                color:"#777777",
                roundSize:true
            },
        });
        return qr;
    }

    for (let i=0; i<9; i++) {
        const qr = generateCode(i);
        qr.append(canvas);
        //qr.download({ name: `qr_${i}`, extension: "svg" });
    }


</script>
</body>
</html>
