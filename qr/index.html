<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QR Code Styling</title>
    <script type="text/javascript" src="./qr-code-styling.js"></script>
</head>
<body>
<div id="canvas"></div>
<script type="text/javascript">

    const qrCode = new QRCodeStyling({
        width: 300,
        height: 300,
        type: "svg",
        image: "./hiro.png",
        data:"https://akodiat.github.io/arView/?i=1",
        shape: "square",
        margin:10,
        qrOptions:{
            typeNumber:"0",
            mode:"Byte",
            errorCorrectionLevel:"H"
        },
        imageOptions:{
                saveAsBlob:true,
                hideBackgroundDots:false,
                imageSize:1,
                margin:6
        },
        dotsOptions:{
            type:"square",
            color:"#888888",
            roundSize:true
        },
    });

    qrCode.append(document.getElementById("canvas"));
    qrCode.download({ name: "qr", extension: "svg" });
</script>
</body>
</html>
