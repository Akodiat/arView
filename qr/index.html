<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QR</title>
    <style>
        #container {
            display: grid;
        }
        .row {
            margin: 50px
        }
    </style>
    <script type="text/javascript" src="./lib/qr-code-styling.js"></script>
</head>
<body>
<div id="container" style="display: grid;"></div>
<script type="module">
    import {BarcodeMarkerGenerator, MATRIX_4X4_BCH_1393} from "./lib/barcode-marker-generator.js"

    const container = document.getElementById("container");

    function generateCode(i, size=200) {
        const g = new BarcodeMarkerGenerator(MATRIX_4X4_BCH_1393, i);
        const qr = new QRCodeStyling({
            width: size,
            height: size,
            type: "svg",
            //image: g.asSVGDataURI(),
            data:`https://akodiat.github.io/arView`,
            shape: "square",
            margin:1,
            qrOptions:{
                typeNumber:"0",
                mode:"Byte",
                errorCorrectionLevel:"L"
            },
            dotsOptions:{
                type:"rounded",
                color:"#000000",
                roundSize:true
            },
        });
        const s = document.createElement("div");
        s.classList.add("row");
        s.innerHTML = g.asSVG(size);
        qr.append(s);
        container.appendChild(s);
        return qr;
    }

    for (let i=0; i<9; i++) {
        const qr = generateCode(i);
        //qr.download({ name: `qr_${i}`, extension: "svg" });
    }


</script>
</body>
</html>
